spring.application.name=SisTomPatrimonio

# Banco em memória para testes com compatibilidade PostgreSQL
spring.datasource.url=jdbc:h2:mem:sipma_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate em ambiente de teste
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.generate-ddl=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Desativa Flyway para não tentar criar schema PostgreSQL fora do teste
spring.flyway.enabled=false

# Garante inicialização correta em testes JPA
spring.jpa.defer-datasource-initialization=false

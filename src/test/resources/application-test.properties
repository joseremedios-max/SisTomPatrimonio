spring.application.name=SisTomPatrimonio

# Banco em memória para testes (compatível com PostgreSQL em nível de SQL)
spring.datasource.url=jdbc:h2:mem:sipma_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate cria o schema no contexto de testes
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.generate-ddl=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Importante: desabilita Flyway para não depender do schema do PostgreSQL
spring.flyway.enabled=false

# Evita carregamento de dados iniciais ou scripts externos desnecessários
spring.sql.init.mode=never
